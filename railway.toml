[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
# Single replica. Railway hobby/free is 1 GB RAM — Playwright + 24 workers OOMs.
# Image defaults: UMBRA_PROFILE=lean, UMBRA_WORKERS=4, UMBRA_CURL_MAX=0,
# UMBRA_BODY_LIMIT=48000, RSS 450/600, NODE_OPTIONS=--max-old-space-size=384,
# UMBRA_PLAYWRIGHT=0.
# Attach a Railway volume at /data so cases + watches survive restarts (UMBRA_CASES_DIR=/data/cases).
# Never put VOLUME in the Dockerfile — Metal builder fails immediately ("VOLUME is not supported").
# Power (≥2 GB): UMBRA_POWER=1 UMBRA_PROFILE=full UMBRA_CURL_MAX=1 UMBRA_WORKERS=8
# Do not set UMBRA_PLAYWRIGHT=1 unless you install Chromium on a larger instance.
