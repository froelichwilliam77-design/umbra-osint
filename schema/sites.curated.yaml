# Extra handle targets + metadata extractors layered on WhatsMyName.
# uri_check must include {account}. Dual-condition matching applies.

sites:
  - name: Hacker News
    uri_check: https://news.ycombinator.com/user?id={account}
    uri_pretty: https://news.ycombinator.com/user?id={account}
    e_code: 200
    e_string: "created:"
    m_code: 200
    m_string: "No such user."
    cat: coding
    known: ["pg", "dang"]
  - name: npm
    uri_check: https://www.npmjs.com/~{account}
    uri_pretty: https://www.npmjs.com/~{account}
    e_code: 200
    e_string: "npm User"
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["isaacs"]
  - name: crates.io
    uri_check: https://crates.io/api/v1/users/{account}
    uri_pretty: https://crates.io/users/{account}
    e_code: 200
    e_string: "\"login\""
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Keybase
    uri_check: https://keybase.io/_/api/1.0/user/lookup.json?username={account}
    uri_pretty: https://keybase.io/{account}
    e_code: 200
    e_string: "\"them\":"
    m_code: 200
    m_string: "\"them\":null"
    cat: social
    known: ["max"]
  - name: Wikipedia (user exists)
    uri_check: https://en.wikipedia.org/w/api.php?action=query&list=users&ususers={account}&format=json
    uri_pretty: https://en.wikipedia.org/wiki/User:{account}
    e_code: 200
    e_string: "\"userid\""
    m_code: 200
    m_string: "\"missing\""
    cat: social
  - name: Stack Overflow
    uri_check: https://api.stackexchange.com/2.3/users?inname={account}&site=stackoverflow
    uri_pretty: https://stackoverflow.com/users?tab=UserRep&filter={account}
    e_code: 200
    e_string: "\"user_id\""
    m_code: 200
    m_string: "\"items\":[]"
    cat: coding
  - name: Hugging Face
    uri_check: https://huggingface.co/api/users/{account}/overview
    uri_pretty: https://huggingface.co/{account}
    e_code: 200
    e_string: "\"user\""
    m_code: 404
    m_string: "error"
    cat: coding
  - name: LinkedIn (public)
    uri_check: https://www.linkedin.com/in/{account}/
    uri_pretty: https://www.linkedin.com/in/{account}/
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: social
    username_regex: "^[A-Za-z0-9-]{3,100}$"
  - name: Mastodon (mastodon.social)
    uri_check: https://mastodon.social/api/v1/accounts/lookup?acct={account}
    uri_pretty: https://mastodon.social/@{account}
    e_code: 200
    e_string: "\"acct\""
    m_code: 404
    m_string: "Record not found"
    cat: social
  - name: Bluesky
    uri_check: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor={account}.bsky.social
    uri_pretty: https://bsky.app/profile/{account}.bsky.social
    e_code: 200
    e_string: "\"handle\""
    m_code: 400
    m_string: "error"
    cat: social
    username_regex: "^[A-Za-z0-9._-]{3,30}$"
  - name: Codeberg
    uri_check: https://codeberg.org/api/v1/users/{account}
    uri_pretty: https://codeberg.org/{account}
    e_code: 200
    e_string: "\"login\""
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: SourceHut
    uri_check: https://sr.ht/~{account}
    uri_pretty: https://sr.ht/~{account}
    e_code: 200
    e_string: "sr.ht"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Dev.to
    uri_check: https://dev.to/api/users/by_username?url={account}
    uri_pretty: https://dev.to/{account}
    e_code: 200
    e_string: "\"username\""
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Kaggle
    uri_check: https://www.kaggle.com/{account}
    uri_pretty: https://www.kaggle.com/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: coding
  - name: Replit
    uri_check: https://replit.com/@{account}
    uri_pretty: https://replit.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Docker Hub
    uri_check: https://hub.docker.com/v2/users/{account}/
    uri_pretty: https://hub.docker.com/u/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: "Not Found"
    cat: coding
    known: ["library"]
  - name: RubyGems
    uri_check: https://rubygems.org/api/v1/profiles/{account}.json
    uri_pretty: https://rubygems.org/profiles/{account}
    e_code: 200
    e_string: '"handle"'
    m_code: 404
    m_string: "Not Found"
    cat: coding
    known: ["qrush"]
  - name: Packagist
    uri_check: https://packagist.org/users/{account}.json
    uri_pretty: https://packagist.org/users/{account}
    e_code: 200
    e_string: '"packages"'
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["stof"]
  - name: Lichess
    uri_check: https://lichess.org/api/user/{account}
    uri_pretty: https://lichess.org/@/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: "Not found"
    cat: gaming
    known: ["thibault"]
  - name: Lobsters
    uri_check: https://lobste.rs/u/{account}
    uri_pretty: https://lobste.rs/u/{account}
    e_code: 200
    e_string: "Joined"
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["jcs", "pushcx"]
  - name: Launchpad
    uri_check: https://api.launchpad.net/1.0/~{account}
    uri_pretty: https://launchpad.net/~{account}
    e_code: 200
    e_string: '"name"'
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["mark"]
  - name: Mojang
    uri_check: https://api.mojang.com/users/profiles/minecraft/{account}
    uri_pretty: https://namemc.com/profile/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: ""
    cat: gaming
    username_regex: "^[A-Za-z0-9_]{3,16}$"
  - name: MyAnimeList
    uri_check: https://api.jikan.moe/v4/users/{account}
    uri_pretty: https://myanimelist.net/profile/{account}
    e_code: 200
    e_string: '"username"'
    m_code: 404
    m_string: "not found"
    cat: hobby
  - name: Roblox
    uri_check: https://users.roblox.com/v1/usernames/users
    uri_pretty: https://www.roblox.com/users/profile?username={account}
    e_code: 200
    e_string: '"requestedUsername"'
    m_code: 200
    m_string: '"data":[]'
    cat: gaming
    post_body: '{"usernames":["{account}"],"excludeBannedUsers":false}'
    headers:
      Content-Type: application/json
      Accept: application/json
    username_regex: "^[A-Za-z0-9_]{3,20}$"
  - name: Internet Archive
    uri_check: https://archive.org/details/@{account}
    uri_pretty: https://archive.org/details/@{account}
    e_code: 200
    e_string: "uploads"
    m_code: 404
    m_string: "Item not available"
    cat: hobby
  - name: Observable
    uri_check: https://observablehq.com/@{account}
    uri_pretty: https://observablehq.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: coding
  - name: Hashnode
    uri_check: https://hashnode.com/@{account}
    uri_pretty: https://hashnode.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: blog
  - name: Osu!
    uri_check: https://osu.ppy.sh/users/{account}
    uri_pretty: https://osu.ppy.sh/users/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: gaming
  - name: TryHackMe
    uri_check: https://tryhackme.com/p/{account}
    uri_pretty: https://tryhackme.com/p/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Letterboxd
    uri_check: https://letterboxd.com/{account}/
    uri_pretty: https://letterboxd.com/{account}/
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: hobby
    username_regex: "^[A-Za-z0-9_]{2,30}$"
  - name: SourceForge
    uri_check: https://sourceforge.net/u/{account}/profile/
    uri_pretty: https://sourceforge.net/u/{account}/profile/
    e_code: 200
    e_string: "User Profile"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Last.fm
    uri_check: https://www.last.fm/user/{account}
    uri_pretty: https://www.last.fm/user/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "User not found"
    cat: music
  - name: SoundCloud
    uri_check: https://soundcloud.com/{account}
    uri_pretty: https://soundcloud.com/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "We can't find that user"
    cat: music
  - name: Discogs
    uri_check: https://www.discogs.com/user/{account}
    uri_pretty: https://www.discogs.com/user/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: music
  - name: Telegram
    uri_check: https://t.me/{account}
    uri_pretty: https://t.me/{account}
    e_code: 200
    e_string: "tgme_page_extra"
    m_code: 200
    m_string: "If you have Telegram, you can contact"
    cat: social
    username_regex: "^[A-Za-z][A-Za-z0-9_]{4,31}$"
  - name: YouTube
    uri_check: https://www.youtube.com/@{account}
    uri_pretty: https://www.youtube.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "This page isn't available"
    cat: video
  - name: Twitch
    uri_check: https://www.twitch.tv/{account}
    uri_pretty: https://www.twitch.tv/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: video
    username_regex: "^[A-Za-z0-9_]{4,25}$"
  - name: Substack
    uri_check: https://substack.com/@{account}
    uri_pretty: https://substack.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: blog
  - name: Product Hunt
    uri_check: https://www.producthunt.com/@{account}
    uri_pretty: https://www.producthunt.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "Page not found"
    cat: business
  - name: CodePen
    uri_check: https://codepen.io/{account}
    uri_pretty: https://codepen.io/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "404"
    cat: coding

overrides:
  - name: Instagram
    username_regex: "^[A-Za-z0-9._]{1,30}$"
  - name: X
    username_regex: "^[A-Za-z0-9_]{1,15}$"
  - name: TikTok
    username_regex: "^[A-Za-z0-9._]{2,24}$"
  - name: Reddit
    username_regex: "^[A-Za-z0-9_-]{3,20}$"
    m_string: "error\": 404"
  - name: GitHub (User)
    username_regex: "^[A-Za-z0-9-]{1,39}$"

extractors:
  - site: GitHub (User)
    kind: json
    avatar: avatar_url
    bio: bio
    followers: followers
    following: following
    displayName: name
    location: location
    website: blog
  - site: GitLab
    kind: json-first
    avatar: avatar_url
    displayName: name
    bio: bio
  - site: Reddit
    kind: json
    avatar: data.icon_img
    displayName: data.subreddit.title
    bio: data.subreddit.public_description
    followers: data.total_karma
  - site: Gitea
    kind: json
    avatar: avatar_url
    displayName: full_name
    bio: description
  - site: Keybase
    kind: json
    displayName: them.0.profile.full_name
    bio: them.0.profile.bio
    location: them.0.profile.location
  - site: crates.io
    kind: json
    displayName: user.login
  - site: Hugging Face
    kind: json
    displayName: user.name
    avatar: user.avatarUrl
  - site: Mastodon (mastodon.social)
    kind: json
    displayName: display_name
    avatar: avatar
    bio: note
    followers: followers_count
    following: following_count
  - site: Bluesky
    kind: json
    displayName: displayName
    avatar: avatar
    bio: description
    followers: followersCount
    following: followsCount
  - site: Codeberg
    kind: json
    displayName: full_name
    avatar: avatar_url
    bio: description
    followers: followers_count
    following: following_count
    website: website
  - site: Dev.to
    kind: json
    displayName: name
    avatar: profile_image
    bio: summary
    website: website_url
  - site: Docker Hub
    kind: json
    displayName: username
    avatar: gravatar_url
  - site: RubyGems
    kind: json
    displayName: handle
  - site: Packagist
    kind: json
    displayName: username
  - site: Lichess
    kind: json
    displayName: username
    bio: profile.bio
    followers: perfs.blitz.rating
  - site: Launchpad
    kind: json
    displayName: display_name
    website: web_link
  - site: Mojang
    kind: json
    displayName: name
  - site: MyAnimeList
    kind: json
    displayName: data.username
    avatar: data.images.jpg.image_url
    bio: data.about
    location: data.location
  - site: Roblox
    kind: json
    displayName: data.0.requestedUsername
  - site: Chess.com
    kind: json
    displayName: username
    avatar: avatar
    followers: followers
    location: location
  - site: Hacker News
    kind: html
  - site: LinkedIn (public)
    kind: html
  - site: YouTube
    kind: html
  - site: Telegram
    kind: html

