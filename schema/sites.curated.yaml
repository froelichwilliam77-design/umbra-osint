# Extra handle targets + metadata extractors layered on WhatsMyName.
# uri_check must include {account}. Dual-condition matching applies.

sites:
  - name: Hacker News
    uri_check: https://news.ycombinator.com/user?id={account}
    uri_pretty: https://news.ycombinator.com/user?id={account}
    e_code: 200
    e_string: "created:"
    m_code: 200
    m_string: "No such user."
    cat: coding
    known: ["pg", "dang"]
  - name: npm
    uri_check: https://www.npmjs.com/~{account}
    uri_pretty: https://www.npmjs.com/~{account}
    e_code: 200
    e_string: "npm User"
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["isaacs"]
  - name: crates.io
    uri_check: https://crates.io/api/v1/users/{account}
    uri_pretty: https://crates.io/users/{account}
    e_code: 200
    e_string: "\"login\""
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Keybase
    uri_check: https://keybase.io/_/api/1.0/user/lookup.json?username={account}
    uri_pretty: https://keybase.io/{account}
    e_code: 200
    e_string: "\"them\":"
    m_code: 200
    m_string: "\"them\":null"
    cat: social
    known: ["max"]
  - name: Wikipedia (user exists)
    uri_check: https://en.wikipedia.org/w/api.php?action=query&list=users&ususers={account}&format=json
    uri_pretty: https://en.wikipedia.org/wiki/User:{account}
    e_code: 200
    e_string: "\"userid\""
    m_code: 200
    m_string: "\"missing\""
    cat: social
  - name: Stack Overflow
    uri_check: https://api.stackexchange.com/2.3/users?inname={account}&site=stackoverflow
    uri_pretty: https://stackoverflow.com/users?tab=UserRep&filter={account}
    e_code: 200
    e_string: "\"user_id\""
    m_code: 200
    m_string: "\"items\":[]"
    cat: coding
  - name: Hugging Face
    uri_check: https://huggingface.co/api/users/{account}/overview
    uri_pretty: https://huggingface.co/{account}
    e_code: 200
    e_string: "\"user\""
    m_code: 404
    m_string: "error"
    cat: coding
  - name: LinkedIn (public)
    uri_check: https://www.linkedin.com/in/{account}/
    uri_pretty: https://www.linkedin.com/in/{account}/
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: social
    username_regex: "^[A-Za-z0-9-]{3,100}$"
  - name: Mastodon (mastodon.social)
    uri_check: https://mastodon.social/api/v1/accounts/lookup?acct={account}
    uri_pretty: https://mastodon.social/@{account}
    e_code: 200
    e_string: "\"acct\""
    m_code: 404
    m_string: "Record not found"
    cat: social
  - name: Bluesky
    uri_check: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor={account}.bsky.social
    uri_pretty: https://bsky.app/profile/{account}.bsky.social
    e_code: 200
    e_string: "\"handle\""
    m_code: 400
    m_string: "error"
    cat: social
    username_regex: "^[A-Za-z0-9._-]{3,30}$"
  - name: Codeberg
    uri_check: https://codeberg.org/api/v1/users/{account}
    uri_pretty: https://codeberg.org/{account}
    e_code: 200
    e_string: "\"login\""
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: SourceHut
    uri_check: https://sr.ht/~{account}
    uri_pretty: https://sr.ht/~{account}
    e_code: 200
    e_string: "sr.ht"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Dev.to
    uri_check: https://dev.to/api/users/by_username?url={account}
    uri_pretty: https://dev.to/{account}
    e_code: 200
    e_string: "\"username\""
    m_code: 404
    m_string: "not found"
    cat: blog
    known: ["ben"]
  - name: Kaggle
    uri_check: https://www.kaggle.com/{account}
    uri_pretty: https://www.kaggle.com/{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: coding
  - name: Replit
    uri_check: https://replit.com/@{account}
    uri_pretty: https://replit.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "not found"
    cat: coding
  - name: Docker Hub
    uri_check: https://hub.docker.com/v2/users/{account}/
    uri_pretty: https://hub.docker.com/u/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: "Not Found"
    cat: coding
    known: ["library"]
  - name: RubyGems
    uri_check: https://rubygems.org/api/v1/profiles/{account}.json
    uri_pretty: https://rubygems.org/profiles/{account}
    e_code: 200
    e_string: '"handle"'
    m_code: 404
    m_string: "Not Found"
    cat: coding
    known: ["qrush"]
  - name: Packagist
    uri_check: https://packagist.org/users/{account}.json
    uri_pretty: https://packagist.org/users/{account}
    e_code: 200
    e_string: '"packages"'
    m_code: 404
    m_string: "not found"
    cat: coding
    known: ["stof"]
  - name: Lichess
    uri_check: https://lichess.org/api/user/{account}
    uri_pretty: https://lichess.org/@/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: "Not found"
    cat: gaming
    known: ["thibault"]
  - name: Lobsters
    uri_check: https://lobste.rs/u/{account}
    uri_pretty: https://lobste.rs/u/{account}
    e_code: 200
    e_string: "Joined"
