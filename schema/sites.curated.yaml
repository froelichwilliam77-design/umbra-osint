  - name: Observable
    uri_check: https://observablehq.com/@{account}
    uri_pretty: https://observablehq.com/@{account}
    e_code: 200
    e_string: "og:title"
    m_code: 404
    m_string: "page not found"
    cat: coding
  - name: Hashnode
    uri_check: https://gql.hashnode.com/
    uri_pretty: https://hashnode.com/@{account}
    post_body: '{"operationName":"UserBadge","query":"query UserBadge($username:String!){user(username:$username){id}}","variables":{"username":"{account}"}}'
    headers:
      Content-Type: application/json
    e_code: 200
    e_string: '"id":'
    m_code: 200
    m_string: '"user":null'
    cat: blog
    known: ["catalinmiron"]
  - name: Osu!
