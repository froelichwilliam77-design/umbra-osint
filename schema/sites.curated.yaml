    cat: coding
    known: ["mark"]
  - name: Mojang
    uri_check: https://api.mojang.com/users/profiles/minecraft/{account}
    uri_pretty: https://namemc.com/profile/{account}
    e_code: 200
    e_string: '"id"'
    m_code: 404
    m_string: ""
    cat: gaming
    username_regex: "^[A-Za-z0-9_]{3,16}$"
  - name: MyAnimeList
    uri_check: https://api.jikan.moe/v4/users/{account}
    uri_pretty: https://myanimelist.net/profile/{account}
    e_code: 200
    e_string: '"username"'
    m_code: 404
    m_string: "not found"
    cat: hobby
  - name: Roblox
    uri_check: https://users.roblox.com/v1/usernames/users
    uri_pretty: https://www.roblox.com/users/profile?username={account}
    e_code: 200
    e_string: '"requestedUsername"'
    m_code: 200
    m_string: '"data":[]'
    cat: gaming
    post_body: '{"usernames":["{account}"],"excludeBannedUsers":false}'
    headers:
      Content-Type: application/json
      Accept: application/json
    username_regex: "^[A-Za-z0-9_]{3,20}$"
  - name: Internet Archive
    uri_check: https://archive.org/details/@{account}
    uri_pretty: https://archive.org/details/@{account}
