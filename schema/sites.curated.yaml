overrides:
  - name: Instagram
    username_regex: "^[A-Za-z0-9._]{1,30}$"
  - name: X
    username_regex: "^[A-Za-z0-9_]{1,15}$"
  - name: TikTok
    username_regex: "^[A-Za-z0-9._]{2,24}$"
  - name: Reddit
    username_regex: "^[A-Za-z0-9_-]{3,20}$"
    m_string: "error\": 404"
  - name: GitHub (User)
    username_regex: "^[A-Za-z0-9-]{1,39}$"
  - name: WordPress.com (Deleted)
    valid: false
  - name: WordPress.org (Forums)
    valid: false
  - name: Medium
    cat: blog
  - name: tumblr
    cat: blog
  - name: Issuu
    cat: blog
  - name: HubPages
    cat: blog
  - name: Livejournal
    cat: blog
  - name: Blogspot
    cat: blog
  - name: Wattpad
    cat: blog
  - name: Hashnode
    cat: blog
  - name: Substack
    cat: blog
  - name: Archive of Our Own
    cat: blog
  - name: write.as
    cat: blog
  - name: GitBook
    cat: blog
  - name: Scribd
    cat: blog
  - name: Independent academia
    cat: blog
  - name: carrd.co
    cat: blog
  - name: InsaneJournal
    cat: blog

extractors:
  - site: GitHub (User)
    kind: json
    avatar: avatar_url
    bio: bio
    followers: followers
    following: following
    displayName: name
    location: location
    website: blog
  - site: GitLab
    kind: json-first
    avatar: avatar_url
    displayName: name
    bio: bio
  - site: Reddit
    kind: json
    avatar: data.icon_img
    displayName: data.subreddit.title
    bio: data.subreddit.public_description
    followers: data.total_karma
  - site: Gitea
    kind: json
    avatar: avatar_url
    displayName: full_name
    bio: description
  - site: Keybase
    kind: json
    displayName: them.0.profile.full_name
    bio: them.0.profile.bio
    location: them.0.profile.location
  - site: crates.io
    kind: json
    displayName: user.login
  - site: Hugging Face
    kind: json
    displayName: user.name
    avatar: user.avatarUrl
  - site: Mastodon (mastodon.social)
    kind: json
    displayName: display_name
    avatar: avatar
    bio: note
    followers: followers_count
    following: following_count
  - site: Bluesky
    kind: json
    displayName: displayName
    avatar: avatar
    bio: description
